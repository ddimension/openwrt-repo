# Baut Images auf den self-hosted Runnern, je fuer master und stable, mit komplettem
# wwand-Stack.
#   chateau : Voll-Buildroot (PR-Geraet + Kernel-Patch + DTS -> kein ImageBuilder
#             moeglich). master aus dem PR-Branch, stable aus chateau-stable-backport.
#             dl/ccache + build_dir persistent (Named Volumes), node-lokal.
#   zyxel   : nr7101 + lte3301-plus sind upstream -> ImageBuilder (kein Toolchain-
#             Build). wwand kommt SIGNIERT aus dem gh-pages-Feed.
# Voraussetzung: image-registry.ddimension.net/myadmin/openwrt-builder:latest.
name: build-device-images

on:
  workflow_dispatch:
    inputs:
      testing_kernel:
        description: 'chateau master mit KERNEL_TESTING_PATCHVER (z.B. 6.18) bauen; stable wird dabei uebersprungen (25.12 hat kein 6.18)'
        type: boolean
        default: false
  # Nach jedem erfolgreichen Feed-Lauf ("build") auf main automatisch Images bauen,
  # damit die frisch (signiert) published wwand-Pakete direkt in Images landen.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: build-device-images
  cancel-in-progress: false

jobs:
  chateau:
    # manueller Dispatch immer; via workflow_run nur, wenn der Feed-Lauf gruen war
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, openwrt]
    # 900 (15h): a cold full buildroot (empty owrt-src/ccache/dl) takes ~12h;
    # 600 timed out chateau-stable once. Warm/incremental runs finish far sooner.
    timeout-minutes: 900
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: master
            src_url: https://github.com/ddimension/openwrt.git
            # Integration branch: latest openwrt main + device support (#24335)
            # + QCA8081 2.5G TX-clock fix (#24566) + ath11k reboot fix (#24601).
            # The individual PR branches stay clean for upstream; this branch
            # carries all three so the built image actually works.
            src_branch: chateau-ci
          - base: stable
            src_url: https://github.com/ddimension/openwrt.git
            src_branch: chateau-stable-backport
    env:
      TARGET: qualcommax
      SUBTARGET: ipq60xx
      DEVICES: mikrotik_chateau-5g-r17-ax
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Prepare volumes + output
        run: |
          for v in "owrt-src-chateau-${{ matrix.base }}" owrt-dl owrt-ccache; do
            docker volume create "$v" >/dev/null
            sudo chown 1000:1000 "$(docker volume inspect -f '{{.Mountpoint}}' "$v")"
          done
          rm -rf out && mkdir -p out
          sudo chown -R 1000:1000 out "$GITHUB_WORKSPACE"

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: image-registry.ddimension.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build (full buildroot)
        # Bei testing_kernel nur master bauen (stable = openwrt-25.12 hat kein 6.18).
        if: ${{ github.event.inputs.testing_kernel != 'true' || matrix.base == 'master' }}
        run: |
          # Vom Runner-CT freigegebene Kerne bestimmen. pct --cores setzt eine
          # cgroup-CPU-Quota; nproc ignoriert die und meldet die volle Node-Kernzahl
          # -> make -j$(nproc) baut massiv ueberparallel und thrasht sich fest
          # (chateau-stable-Hang bei qca-ssdk). Die Quota ist nur HIER im Runner-CT
          # sichtbar -- im verschachtelten Build-Container ist die eigene cpu.max = max
          # (cgroup-Namespace) -> dort wuerde nproc wieder ueberzaehlen. Also hier lesen
          # und als MAKE_JOBS reinreichen.
          jobs="$(nproc)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then                    # cgroup v2
            read -r q p < /sys/fs/cgroup/cpu.max
            if [ "$q" != max ] && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then     # cgroup v1
            q="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            p="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [ "${q:-0}" -gt 0 ] 2>/dev/null && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          fi
          [ "${jobs:-0}" -ge 1 ] 2>/dev/null || jobs=1
          echo "chateau build: -j${jobs} (freigegebene Kerne des Runner-CT)"
          docker run --rm --user 1000:1000 \
            -e SRC_URL='${{ matrix.src_url }}' \
            -e SRC_BRANCH='${{ matrix.src_branch }}' \
            -e TARGET="$TARGET" -e SUBTARGET="$SUBTARGET" -e DEVICES="$DEVICES" \
            -e WWAND_FEED='https://github.com/ddimension/openwrt-repo.git' \
            -e MAKE_JOBS="$jobs" \
            -e TESTING_KERNEL='${{ github.event.inputs.testing_kernel == 'true' && '1' || '' }}' \
            -v "$GITHUB_WORKSPACE":/ci:ro \
            -v "$GITHUB_WORKSPACE/out":/out \
            -v "owrt-src-chateau-${{ matrix.base }}":/src \
            -v owrt-dl:/dl -v owrt-ccache:/ccache \
            image-registry.ddimension.net/myadmin/openwrt-builder:latest \
            bash /ci/.github/ci/build-images.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-chateau-${{ matrix.base }}
          path: out/**
          retention-days: 30
          if-no-files-found: warn

  zyxel:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, openwrt]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        base: [master, stable]
    env:
      DEVICES: zyxel_nr7101 zyxel_lte3301-plus
      ARCH: mipsel_24kc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            keys
          sparse-checkout-cone-mode: false

      - name: Prepare output + IB volume
        run: |
          docker volume create "owrt-ib-${{ matrix.base }}" >/dev/null
          sudo chown 1000:1000 "$(docker volume inspect -f '{{.Mountpoint}}' "owrt-ib-${{ matrix.base }}")"
          rm -rf out && mkdir -p out
          sudo chown -R 1000:1000 out "$GITHUB_WORKSPACE"

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: image-registry.ddimension.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Der Feed wird von GitHub Pages ausgeliefert, und dieser Workflow haengt
      # per workflow_run am Feed-Build -- wir starten also typischerweise
      # WAEHREND das Pages-Deployment mit dem neuen packages.adb noch laeuft.
      # apk liest dann den alten Index, dessen .apk-Dateien der Publish bereits
      # ersetzt hat: "wget: exited with error 8 / unexpected end of file"
      # (Lauf 32545665275, zyxel master: wwand r28 statt r33). Also erst auf das
      # Deployment warten, das den ausloesenden Feed-Lauf enthaelt.
      - name: Wait for the package feed deployment
        run: |
          # Der Feed-Lauf, an dem wir haengen (leer bei workflow_dispatch):
          # sein Abschlusszeitpunkt ist die Untergrenze fuer das Deployment.
          after='${{ github.event.workflow_run.updated_at }}'
          api="https://api.github.com/repos/${{ github.repository }}/pages/builds/latest"
          for i in $(seq 1 20); do
            json="$(curl -sf -H 'Accept: application/vnd.github+json' \
                      -H 'Authorization: Bearer ${{ github.token }}' "$api")" || json=
            status="$(printf '%s' "$json" | grep -o '"status": *"[^"]*"' | head -1 | cut -d'"' -f4)"
            updated="$(printf '%s' "$json" | grep -o '"updated_at": *"[^"]*"' | head -1 | cut -d'"' -f4)"
            case "$status" in
              built)
                # ISO-8601-UTC vergleicht sich lexikografisch korrekt.
                if [ -z "$after" ] || [ "$updated" \> "$after" ] || [ "$updated" = "$after" ]; then
                  echo "Feed-Deployment steht (status=built, updated=$updated)"
                  exit 0
                fi
                echo "letztes Deployment ist aelter als der Feed-Lauf ($updated < $after) -- warte"
                ;;
              errored)
                echo "WARNUNG: Pages-Deployment steht auf 'errored'; der Feed kann veraltet sein."
                exit 0
                ;;
              *)
                echo "Pages-Deployment laeuft (status=${status:-unbekannt}), warte 15 s"
                ;;
            esac
            sleep 15
          done
          echo "WARNUNG: 5 min ohne passendes Pages-Deployment -- baue trotzdem;"
          echo "der Retry in build-imagebuilder.sh faengt einen veralteten Index ggf. ab."

      - name: Build (ImageBuilder)
        run: |
          GHP_DIR='${{ matrix.base == 'master' && 'snapshot' || 'openwrt-25.12' }}'
          docker run --rm --user 1000:1000 \
            -e BASE='${{ matrix.base }}' \
            -e DEVICES="$DEVICES" \
            -e ARCH="$ARCH" \
            -e GHP_DIR="$GHP_DIR" \
            -v "$GITHUB_WORKSPACE":/ci:ro \
            -v "$GITHUB_WORKSPACE/out":/out \
            -v "owrt-ib-${{ matrix.base }}":/work \
            image-registry.ddimension.net/myadmin/openwrt-builder:latest \
            bash /ci/.github/ci/build-imagebuilder.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-zyxel-${{ matrix.base }}
          path: out/**
          retention-days: 30
          if-no-files-found: warn

  # Copy the built device images into the repo (gh-pages) under /images so they
  # have a stable, browsable URL (the 30-day run artifacts above stay too). Seeds
  # from the current gh-pages so the package feed and other images survive; the
  # feed publish job keeps the images/ dir via its prune keep-list.
  publish-images:
    needs: [chateau, zyxel]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      - name: Reset workspace (defeat leftover sparse-checkout)
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "$GITHUB_WORKSPACE"/*

      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: dl

      - name: Publish images to gh-pages /images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -d dl ] && [ -n "$(ls -A dl 2>/dev/null)" ] || { echo "no image artifacts"; exit 0; }
          git clone --depth 1 -b gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          for art in dl/images-*; do
            [ -d "$art" ] || continue
            rest="$(basename "$art")"; rest="${rest#images-}"
            group="${rest%-*}"; base="${rest##*-}"      # images-zyxel-master -> group=zyxel base=master
            dest="site/images/${group}/${base}"
            rm -rf "$dest"; mkdir -p "$dest"
            # the artifact holds a single target dir (qualcommax-ipq60xx /
            # ramips-mt7621-<base>); flatten it and drop the per-image package repo
            sub="$(find "$art" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$sub" ]; then cp -a "$sub"/. "$dest"/; else cp -a "$art"/. "$dest"/; fi
            rm -rf "$dest/packages"
            echo "published $group/$base"
          done
          # regenerate directory indexes site-wide (GitHub Pages serves no listings)
          cd site
          find . -path ./.git -prune -o -type d -print | while read -r d; do
            rel="${d#.}"; rel="${rel#/}"
            {
              printf '<!doctype html><meta charset="utf-8"><title>openwrt-repo/%s</title>' "$rel"
              printf '<style>body{font:14px/1.5 monospace;margin:2em}td{padding:0 1.5em 0 0}</style>'
              printf '<h2>openwrt-repo/%s</h2><table>' "$rel"
              [ -n "$rel" ] && printf '<tr><td><a href="../">../</a></td></tr>'
              for e in "$d"/*; do
                [ -e "$e" ] || continue; n="$(basename "$e")"; [ "$n" = index.html ] && continue
                if [ -d "$e" ]; then printf '<tr><td><a href="%s/">%s/</a></td></tr>' "$n" "$n"
                else printf '<tr><td><a href="%s">%s</a></td></tr>' "$n" "$n"; fi
              done
              printf '</table>'
            } > "$d/index.html"
          done
          git config user.email "ci@ddimension.net"
          git config user.name "ddimension ci"
          git add -A
          git diff --cached --quiet || git commit -q -m "images: device images @ ${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
