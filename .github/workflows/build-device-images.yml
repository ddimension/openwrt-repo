# Baut Device-Images auf den self-hosted Runnern, je fuer die OpenWrt-Basen master
# und stable, mit komplettem wwand-Stack und ddimension-feed — IMMER gegen den
# stable-Kanal dieses Feeds:
#   fullbuild: Voll-Buildroot je Geraet (PR-Geraet + Kernel-Patch + DTS -> kein
#             ImageBuilder moeglich). chateau master/stable, nbg7815 nur master.
#             wwand-Feed = src-git dieses Repos, gepinnt auf den stable-Commit,
#             der den Lauf ausgeloest hat. dl/ccache + build_dir persistent
#             (Named Volumes), node-lokal.
#   zyxel   : nr7101 + lte3301-plus sind upstream -> ImageBuilder (kein Toolchain-
#             Build). wwand kommt SIGNIERT aus dem stable-Baum auf gh-pages.
# "master"/"stable" in den Matrizen ist die OPENWRT-Basis (master bzw. der
# 25.12-Release-Branch), nicht der Kanal dieses Feeds — der ist immer stable. Die
# Namen bleiben: Volumes und Artefakte haengen daran, ein umbenannter chateau-Leg
# verliert sein warmes build_dir (~12 h Kaltbau).
#
# Achtung workflow_run: GitHub fuehrt IMMER diese Datei und den Checkout des
# DEFAULT-Branch (main) aus. Die Skripte unter .github/ci kommen also von main,
# nur die Pakete von stable — so passen Workflow und Skripte zueinander.
# Voraussetzung: image-registry.ddimension.net/myadmin/openwrt-builder:latest.
name: build-device-images

on:
  workflow_dispatch:
    inputs:
      testing_kernel:
        description: 'master-Legs mit KERNEL_TESTING_PATCHVER (z.B. 6.18) bauen; stable wird dabei uebersprungen (25.12 hat kein 6.18). Nur Artefakte, kein Publish nach gh-pages.'
        type: boolean
        default: false
  # Nach jedem erfolgreichen Feed-Lauf ("build") auf stable automatisch Images
  # bauen, damit ein frisches Release direkt in Images landet. main-Laeufe loesen
  # hier nichts aus.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [stable]

concurrency:
  group: build-device-images
  cancel-in-progress: false

env:
  # Der Feed-Kanal, gegen den ALLE Images bauen, und wo er liegt.
  FEED_CHANNEL: stable
  FEED_GIT: https://github.com/ddimension/openwrt-repo.git
  FEED_ROOT: https://ddimension.github.io/openwrt-repo

jobs:
  fullbuild:
    # manueller Dispatch immer; via workflow_run nur, wenn der Feed-Lauf gruen war
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, openwrt]
    # 900 (15h): a cold full buildroot (empty owrt-src/ccache/dl) takes ~12h;
    # 600 timed out chateau-stable once. Warm/incremental runs finish far sooner.
    timeout-minutes: 900
    strategy:
      fail-fast: false
      matrix:
        include:
          # slug benennt Volume und Artefakt: owrt-src-<slug>-<base> und
          # images-<slug>-<base>. Fuer chateau bewusst unveraendert, sonst
          # verliert der Leg sein warmes build_dir und baut ~12 h kalt neu.
          - slug: chateau
            base: master
            src_url: https://github.com/ddimension/openwrt.git
            # Integration branch: latest openwrt main + device support (#24335)
            # + QCA8081 2.5G TX-clock fix (#24566) + ath11k reboot fix (#24601).
            # The individual PR branches stay clean for upstream; this branch
            # carries all three so the built image actually works.
            src_branch: chateau-ci
            target: qualcommax
            subtarget: ipq60xx
            devices: mikrotik_chateau-5g-r17-ax
          - slug: chateau
            base: stable
            src_url: https://github.com/ddimension/openwrt.git
            src_branch: chateau-stable-backport
            target: qualcommax
            subtarget: ipq60xx
            devices: mikrotik_chateau-5g-r17-ax
          # ZyXEL NBG7815: RGB-LED, Bluetooth, Luefter/Temperatursensor und der
          # 160-MHz-Boardfile-Schalter, PR-Branch nbg7815-update. Vorerst nur
          # master - fuer stable gibt es keinen Backport-Branch.
          - slug: nbg7815
            base: master
            src_url: https://github.com/ddimension/openwrt.git
            src_branch: nbg7815-update
            target: qualcommax
            subtarget: ipq807x
            devices: zyxel_nbg7815
    env:
      TARGET: ${{ matrix.target }}
      SUBTARGET: ${{ matrix.subtarget }}
      DEVICES: ${{ matrix.devices }}
    steps:
      # Wie in build.yml: alle Jobs beider Workflows teilen sich auf einem Runner
      # dasselbe Checkout-Verzeichnis. Voller Checkout, kein sparse-checkout mehr
      # (der vergiftete frueher den Workspace der Feed-Jobs).
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      - name: Prepare volumes + output
        run: |
          for v in "owrt-src-${{ matrix.slug }}-${{ matrix.base }}" owrt-dl owrt-ccache; do
            docker volume create "$v" >/dev/null
            sudo chown 1000:1000 "$(docker volume inspect -f '{{.Mountpoint}}' "$v")"
          done
          rm -rf out && mkdir -p out
          sudo chown -R 1000:1000 out "$GITHUB_WORKSPACE"

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: image-registry.ddimension.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build (full buildroot)
        # Bei testing_kernel nur master bauen (stable = openwrt-25.12 hat kein 6.18).
        if: ${{ github.event.inputs.testing_kernel != 'true' || matrix.base == 'master' }}
        env:
          # Der wwand-Feed als src-git. Nach einem stable-Feed-Lauf auf genau
          # dessen Commit gepinnt (scripts/feeds-Form <url>^<sha>) — dann traegt
          # das Image dieselben Pakete, die der zyxel-Leg aus dem publizierten
          # Baum zieht. Von Hand: die Spitze des Kanal-Branches (<url>;stable).
          # scripts/feeds merkt sich die Quelle und klont feeds/wwand neu, sobald
          # sie sich aendert; der persistente /src-Baum zieht also sauber mit.
          WWAND_FEED: ${{ github.event.workflow_run.head_sha && format('{0}^{1}', env.FEED_GIT, github.event.workflow_run.head_sha) || format('{0};{1}', env.FEED_GIT, env.FEED_CHANNEL) }}
        run: |
          # Vom Runner-CT freigegebene Kerne bestimmen. pct --cores setzt eine
          # cgroup-CPU-Quota; nproc ignoriert die und meldet die volle Node-Kernzahl
          # -> make -j$(nproc) baut massiv ueberparallel und thrasht sich fest
          # (chateau-stable-Hang bei qca-ssdk). Die Quota ist nur HIER im Runner-CT
          # sichtbar -- im verschachtelten Build-Container ist die eigene cpu.max = max
          # (cgroup-Namespace) -> dort wuerde nproc wieder ueberzaehlen. Also hier lesen
          # und als MAKE_JOBS reinreichen.
          jobs="$(nproc)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then                    # cgroup v2
            read -r q p < /sys/fs/cgroup/cpu.max
            if [ "$q" != max ] && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then     # cgroup v1
            q="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            p="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [ "${q:-0}" -gt 0 ] 2>/dev/null && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          fi
          [ "${jobs:-0}" -ge 1 ] 2>/dev/null || jobs=1
          echo "${{ matrix.slug }} build: -j${jobs} (freigegebene Kerne des Runner-CT)"
          echo "wwand-Feed: $WWAND_FEED"
          docker run --rm --user 1000:1000 \
            -e SRC_URL='${{ matrix.src_url }}' \
            -e SRC_BRANCH='${{ matrix.src_branch }}' \
            -e TARGET="$TARGET" -e SUBTARGET="$SUBTARGET" -e DEVICES="$DEVICES" \
            -e WWAND_FEED="$WWAND_FEED" \
            -e MAKE_JOBS="$jobs" \
            -e TESTING_KERNEL='${{ github.event.inputs.testing_kernel == 'true' && '1' || '' }}' \
            -v "$GITHUB_WORKSPACE":/ci:ro \
            -v "$GITHUB_WORKSPACE/out":/out \
            -v "owrt-src-${{ matrix.slug }}-${{ matrix.base }}":/src \
            -v owrt-dl:/dl -v owrt-ccache:/ccache \
            image-registry.ddimension.net/myadmin/openwrt-builder:latest \
            bash /ci/.github/ci/build-images.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.slug }}-${{ matrix.base }}
          path: out/**
          retention-days: 30
          if-no-files-found: warn

  zyxel:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, openwrt]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        base: [master, stable]
    env:
      DEVICES: zyxel_nr7101 zyxel_lte3301-plus
      ARCH: mipsel_24kc
      # OpenWrt-Basis -> Release-Verzeichnis im Feed
      GHP_DIR: ${{ matrix.base == 'master' && 'snapshot' || 'openwrt-25.12' }}
    steps:
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      - name: Prepare output + IB volume
        run: |
          docker volume create "owrt-ib-${{ matrix.base }}" >/dev/null
          sudo chown 1000:1000 "$(docker volume inspect -f '{{.Mountpoint}}' "owrt-ib-${{ matrix.base }}")"
          rm -rf out && mkdir -p out
          sudo chown -R 1000:1000 out "$GITHUB_WORKSPACE"

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: image-registry.ddimension.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Wir starten, sobald der Feed-Lauf fertig ist -- typischerweise WAEHREND
      # GitHub Pages dessen Publish noch ausliefert. apk liest dann den alten Index,
      # dessen .apk-Dateien der Publish bereits ersetzt hat: "wget: exited with
      # error 8 / unexpected end of file" (Lauf 32545665275, zyxel master: wwand
      # r28 statt r33). Also warten, bis der Baum, aus dem wir bauen, der des
      # ausloesenden Commits ist: publish-pages.sh stempelt jeden Baum mit seinem
      # Commit (.published). Das ist genau, wo die Pages-Build-API es nicht war (ein
      # dazwischen landender main-Publish ist ein neueres Deployment des falschen
      # Kanals), und braucht keine API-Berechtigung. Der Query-String macht jede
      # Abfrage zum CDN-Cache-Miss. Bei manuellem Dispatch: kein Warten.
      - name: Wait for the stable feed of the triggering commit
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          url="$FEED_ROOT/$FEED_CHANNEL/$GHP_DIR/$ARCH/.published"
          for i in $(seq 1 80); do
            got="$(curl -sf "$url?ts=$(date +%s)" || true)"
            case " $got " in
              *" $SHA "*) echo "Feed steht: $got"; exit 0 ;;
            esac
            echo "[$i/80] ${got:-noch kein Stempel} -- warte auf $SHA"
            sleep 15
          done
          echo "::warning::stable-Feed fuer $SHA nach 20 min nicht ausgeliefert -- baue gegen den publizierten Stand (build-imagebuilder.sh faengt einen veralteten Index mit Retries ab)"

      - name: Build (ImageBuilder)
        run: |
          docker run --rm --user 1000:1000 \
            -e BASE='${{ matrix.base }}' \
            -e DEVICES="$DEVICES" \
            -e ARCH="$ARCH" \
            -e GHP_DIR="$GHP_DIR" \
            -e FEED_CHANNEL="$FEED_CHANNEL" \
            -e FEED_ROOT="$FEED_ROOT" \
            -v "$GITHUB_WORKSPACE":/ci:ro \
            -v "$GITHUB_WORKSPACE/out":/out \
            -v "owrt-ib-${{ matrix.base }}":/work \
            image-registry.ddimension.net/myadmin/openwrt-builder:latest \
            bash /ci/.github/ci/build-imagebuilder.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-zyxel-${{ matrix.base }}
          path: out/**
          retention-days: 30
          if-no-files-found: warn

  # Die Images zusaetzlich unter images/<gruppe>/<base>/ auf gh-pages, damit sie
  # eine feste, durchsuchbare URL haben (die 30-Tage-Run-Artefakte bleiben).
  # publish-pages.sh ersetzt nur diese Verzeichnisse; Feed-Kanaele bleiben stehen.
  # Testkernel-Images sind nicht das, was Geraete bekommen sollen: die bleiben
  # reine Run-Artefakte.
  publish-images:
    needs: [fullbuild, zyxel]
    if: ${{ !cancelled() && github.event.inputs.testing_kernel != 'true' }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: dl

      - name: Publish images to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # der Feed-Commit, gegen den gebaut wurde (bei Dispatch: dieser Checkout)
          PAGES_STAMP_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pairs=()
          for art in dl/images-*/; do
            [ -d "$art" ] || continue
            rest="$(basename "$art")"; rest="${rest#images-}"
            group="${rest%-*}"; base="${rest##*-}"      # images-zyxel-master -> zyxel / master
            # the artifact holds a single target dir (qualcommax-ipq60xx /
            # ramips-mt7621-<base>): flatten it and drop the per-image package repo
            sub="$(find "$art" -mindepth 1 -maxdepth 1 -type d | head -1)"
            stage="staging/$group/$base"
            mkdir -p "$stage"
            cp -R "${sub:-$art}/." "$stage/"
            rm -rf "$stage/packages"
            pairs+=("$stage=images/$group/$base")
          done
          if [ ${#pairs[@]} -eq 0 ]; then
            echo "no image artifacts"
            exit 0
          fi
          .github/ci/publish-pages.sh \
            -m "images @ $PAGES_STAMP_SHA ($FEED_CHANNEL)" \
            --channel "$FEED_CHANNEL" \
            "${pairs[@]}"
