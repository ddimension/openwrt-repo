# Build the feed for every release branch × package architecture and publish
# the binary package repositories to GitHub Pages (gh-pages branch), one
# directory per <release>/<arch>.
#
# Efficiency: a new push to main cancels the still-running previous build
# (concurrency group), .md-only changes don't trigger at all, artifacts are
# kept for 2 days only, and gh-pages history is collapsed to a single commit
# per deploy (force_orphan) so the branch never grows.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, openwrt]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Release branches to build. Add future OpenWrt releases here as they
        # appear (the value doubles as the directory name on the site;
        # 'snapshot' builds against master).
        #
        release:
          - snapshot
          - openwrt-25.12
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      # Self-hosted-Runner teilen sich das Checkout-Verzeichnis mit
      # build-device-images.yml, das per `sparse-checkout: .github` nur .github
      # auscheckt. Laeuft danach ein Feed-Checkout auf demselben Runner, stellt
      # actions/checkout den vollen Baum NICHT zuverlaessig wieder her -> Workspace
      # enthaelt nur .git/.github -> /feed leer -> "No feed for package" -> Jobs rot.
      # Darum vor dem Checkout hart leeren (Repo ist klein, Vollclone ~gratis).
      - name: Reset workspace (defeat leftover sparse-checkout)
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "$GITHUB_WORKSPACE"/*
      - uses: actions/checkout@v4

      # authenticated docker.io pulls (qemu binfmt inside gh-action-sdk) —
      # avoids the anonymous-pull rate-limit/timeout flakes
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build packages
        uses: ./.github/actions/openwrt-sdk
        env:
          ARCH: ${{ matrix.arch }}${{ matrix.release != 'snapshot' && format('-{0}', matrix.release) || '' }}
          # NOTE on registry flakes: the SDK image already comes from ghcr.io
          # (action default; CONTAINER would be the UNTAGGED image — the
          # action appends :$ARCH itself). docker.io is only touched for the
          # embedded qemu binfmt pull, authenticated via the login step
          # above. Should a job still flake: gh run rerun --failed.
          FEEDNAME: wwand
          # lifts GitHub's anonymous clone limit for the feed updates; see the
          # note in the action's entrypoint. Read-only, and the default token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bytecode shipping needs NOTHING here, and that is the point.
          #
          # It used to be an opt-in symbol pushed through EXTRA_CONFIG, which
          # turned the whole openwrt-25.12 matrix red: defconfig dropped both
          # CONFIG_WWAND_UCODE_PRECOMPILE and the CONFIG_PACKAGE_wwand it
          # depended on, so a per-package SDK build could not carry it. The
          # Makefile now states the opposite polarity — bytecode is the default
          # and CONFIG_WWAND_UCODE_SOURCE opts OUT — so a symbol that does not
          # survive defconfig lands on the behaviour we want instead of
          # silently reverting it. PKG_BUILD_DEPENDS pulls ucode/host
          # unconditionally, and the cmake capability probe ships source rather
          # than failing if that compiler cannot emit bytecode.
          #
          # EXTRA_CONFIG stays wired (and is verified after `feeds install`)
          # for whatever needs it next; it is deliberately empty.
          EXTRA_CONFIG: ''
          # Per-package mode: builds exactly these source packages plus their
          # real dependencies — no whole-feed surface, no exposure to
          # unrelated upstream breakage (the perl parallel-build race cost us
          # a job in three runs). The per-package check enforces
          # PKG_MIRROR_HASH: after every PKG_SOURCE_VERSION bump run
          # scripts/update-hashes.sh and commit the Makefile change. The
          # hash check is a no-op for homesync and the q* packages: they
          # build from files/ in this repo and declare no PKG_SOURCE.
          # homesync needs snapclient only at runtime (EXTRA_DEPENDS), so
          # this does not drag the snapcast C++ build into CI.
          # ddimension-feed carries this feed's own address and key, so a
          # device can be pointed at it once and then follow it like any other
          # package. It is built per release and architecture because the URL
          # it installs names both.
          PACKAGES: apman ddimension-feed homesync luacurl lua-mosquitto qfirehose qflash qlog usb-relay-hid wpad-ieee8021x wpad-saeradh2e wwand wwand-lpac luci-app-wwand luci-proto-wwand
          INDEX: 1
          # not staged for openwrt.org upstream — skip patch-refresh and
          # shfmt hygiene checks; the hash check stays active
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # usign key for opkg-based releases (<= 24.10), apk key for
          # snapshot/25.12+. Empty secrets simply leave the index unsigned.
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # ddimension-feed can work this out from the buildroot version, but
          # here it need not guess: this is the directory the publish step
          # below writes to, so the .list it installs and the tree it points
          # at cannot disagree.
          DDIMENSION_FEED_RELEASE: ${{ matrix.release }}

      - name: Collect repository
        run: |
          mkdir -p "public/${{ matrix.release }}/${{ matrix.arch }}"
          cp -a "bin/packages/${{ matrix.arch }}/wwand/." \
                "public/${{ matrix.release }}/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}-${{ matrix.arch }}
          path: public
          retention-days: 30

  publish:
    # publish whatever succeeded even if some matrix legs failed — the seed
    # from the current gh-pages below keeps their previous state alive
    needs: build
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      # s.o.: vollen Baum erzwingen, sonst fehlen z.B. keys/ beim Publish.
      - name: Reset workspace (defeat leftover sparse-checkout)
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "$GITHUB_WORKSPACE"/*
      - uses: actions/checkout@v4

      # seed with the currently published site so <release>/<arch> dirs that
      # were not (re)built in this run survive the deploy
      - uses: actions/checkout@v4
        continue-on-error: true # first run: gh-pages doesn't exist yet
        with:
          ref: gh-pages
          path: public

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true

      - name: Merge fresh build into site
        run: |
          mkdir -p public fresh
          rm -rf public/.git
          # clear cruft a broken past deploy left in gh-pages: the whole feed had
          # been nested under undefined/actions_github_pages_<ts>/... (a stray path
          # var + the peaceiris staging dir), which the seed checkout above would
          # otherwise perpetuate forever and leaves the site root at 404. The build
          # matrix rebuilds every arch each run, so the fresh artifacts below fully
          # repopulate <release>/<arch>; only real release dirs + keys must survive.
          for e in public/*; do
            [ -e "$e" ] || continue
            case "$(basename "$e")" in
              keys|index.html|images|openwrt-*|snapshot) ;;
              *) echo "pruning stray $e"; rm -rf "$e" ;;
            esac
          done
          # replace (not overlay) every dir that was rebuilt, so outdated
          # package versions don't accumulate
          for archdir in fresh/*/*/; do
            [ -d "$archdir" ] || continue
            dest="public/${archdir#fresh/}"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            mv "$archdir" "$dest"
          done
          # public signing keys (committed under keys/) at the site root
          if [ -d keys ]; then cp -a keys public/; fi
          find public -maxdepth 2 -type d | sort

      # GitHub Pages serves no directory listings — generate a static
      # index.html per directory so the repo is browsable
      - name: Generate directory indexes
        run: |
          find public -type d | while read -r d; do
            rel="${d#public}"; rel="${rel#/}"
            {
              printf '<!doctype html><meta charset="utf-8">'
              printf '<title>openwrt-repo/%s</title>' "$rel"
              printf '<style>body{font:14px/1.5 monospace;margin:2em}'
              printf 'td{padding:0 1.5em 0 0}td.n{text-align:right}'
              printf 'th{text-align:left;padding:0 1.5em .3em 0;border-bottom:1px solid #ccc}</style>'
              printf '<h2>openwrt-repo/%s</h2><table>' "$rel"
              printf '<tr><th>Name</th><th>Size</th><th>Date</th><th>Time (UTC)</th></tr>'
              [ -n "$rel" ] && printf '<tr><td><a href="../">../</a></td><td></td><td></td><td></td></tr>'
              for e in "$d"/*; do
                [ -e "$e" ] || continue
                n="$(basename "$e")"
                [ "$n" = index.html ] && continue
                # mtime, not a field from the index: apk's ADB carries no
                # timestamp at all (arch/depends/description/file-size/hashes/
                # installed-size/license/maintainer/origin/provides/url/version
                # and nothing else). It is honest here because the matrix
                # rebuilds every arch on every run and the arch directory is
                # REPLACED wholesale above, so nothing is carried over from an
                # older publish that could show a stale date.
                dt="$(date -u -r "$e" '+%Y-%m-%d')"
                tm="$(date -u -r "$e" '+%H:%M')"
                if [ -d "$e" ]; then
                  printf '<tr><td><a href="%s/">%s/</a></td><td></td><td>%s</td><td>%s</td></tr>' \
                    "$n" "$n" "$dt" "$tm"
                else
                  printf '<tr><td><a href="%s">%s</a></td><td class="n">%s</td><td>%s</td><td>%s</td></tr>' \
                    "$n" "$n" "$(LC_ALL=C numfmt --to=iec --suffix=B "$(stat -c%s "$e")")" "$dt" "$tm"
                fi
              done
              printf '</table>'
            } > "$d/index.html"
          done
          echo "indexed $(find public -name index.html | wc -l) directories"

      - name: Deploy to gh-pages
        # peaceiris/actions-gh-pages built its work dir at $RUNNER_TEMP/... but
        # RUNNER_TEMP is empty on these self-hosted runners, so the whole feed
        # got committed under a literal `undefined/actions_github_pages_<ts>/`
        # and every feed URL served 404. Publish deterministically instead: a
        # plain force-push of public/ to the gh-pages root (orphan each time).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch public/.nojekyll
          cd public
          rm -rf .git
          git init -q
          git checkout -q -b gh-pages
          git config user.email "ci@ddimension.net"
          git config user.name "ddimension ci"
          git add -A
          git commit -q -m "packages @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
