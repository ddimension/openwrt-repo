# Build the feed for every release branch × package architecture and publish
# the binary package repositories to GitHub Pages (gh-pages branch).
#
# One workflow, two channels — the channel is the branch:
#   main    -> main/<release>/<arch>/     development
#   stable  -> stable/<release>/<arch>/   releases, mirrored to the pre-channel
#              path <release>/<arch>/ that devices set up before the split
#              still follow
# A workflow_dispatch on any other branch builds but publishes nothing.
#
# Efficiency: a new push cancels the still-running build of the same branch
# (main and stable never cancel each other), .md-only changes don't trigger at
# all, and gh-pages is a single orphan commit so the branch never grows
# (.github/ci/publish-pages.sh, the only writer of that branch).
name: build

on:
  push:
    branches: [main, stable]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The channel of this run: where its packages are published, and the tree the
  # ddimension-feed package built here points devices at (the SDK action passes
  # it into the build). Any branch but stable builds as main; only main and
  # stable publish at all (see the publish job).
  DDIMENSION_FEED_CHANNEL: ${{ github.ref_name == 'stable' && 'stable' || 'main' }}

jobs:
  build:
    runs-on: [self-hosted, openwrt]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt release branches to build. Add future OpenWrt releases here as
        # they appear (the value doubles as the directory name on the site;
        # 'snapshot' builds against master). A release dropped from this list
        # keeps its published trees until they are removed explicitly
        # (publish-pages.sh --remove).
        release:
          - snapshot
          - openwrt-25.12
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          # rockchip/armv8 (RK33xx/RK35xx) sets ARCH:=aarch64 and no CPU_TYPE,
          # so the whole subtarget lands on the generic aarch64 package arch —
          # and with it every Hinlink/NanoPi/Radxa board in that family, none of
          # which could add this feed at all (ddimension/wwand#23).
          - aarch64_generic
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      # Self-hosted-Runner teilen sich das Checkout-Verzeichnis zwischen allen
      # Jobs beider Workflows. Ein liegengebliebener sparse-checkout (den
      # build-device-images.yml bis zur Kanal-Trennung nutzte) wurde von
      # actions/checkout NICHT zuverlaessig zurueckgebaut -> Workspace enthielt nur
      # .git/.github -> /feed leer -> "No feed for package" -> Jobs rot. Heute
      # checkt kein Job mehr sparse aus; der Reset bleibt, damit kein alter
      # Workspace-Stand in einen Build durchschlaegt (Repo ist klein, Vollclone ~gratis).
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      # authenticated docker.io pulls (qemu binfmt inside gh-action-sdk) —
      # avoids the anonymous-pull rate-limit/timeout flakes
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Per-package mode: the SDK action builds exactly these source packages
      # plus their real dependencies — no whole-feed surface, no exposure to
      # unrelated upstream breakage (the perl parallel-build race cost us a job
      # in three runs). The per-package check enforces PKG_MIRROR_HASH: after
      # every PKG_SOURCE_VERSION bump run scripts/update-hashes.sh and commit
      # the Makefile change. The list lives in .github/ci/packages, which
      # scripts/local-build.sh reads too. An empty PACKAGES would make the
      # action build the WHOLE feed (entrypoint.sh) — heatingrod's rust
      # toolchain included — so empty is an error, never a default.
      - name: Package list
        run: |
          pkgs="$(sed 's/#.*//' .github/ci/packages | xargs)"
          [ -n "$pkgs" ] || { echo "::error file=.github/ci/packages::no packages listed"; exit 1; }
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "channel $DDIMENSION_FEED_CHANNEL, packages: $pkgs"

      - name: Build packages
        uses: ./.github/actions/openwrt-sdk
        env:
          ARCH: ${{ matrix.arch }}${{ matrix.release != 'snapshot' && format('-{0}', matrix.release) || '' }}
          # NOTE on registry flakes: the SDK image already comes from ghcr.io
          # (action default; CONTAINER would be the UNTAGGED image — the
          # action appends :$ARCH itself). docker.io is only touched for the
          # embedded qemu binfmt pull, authenticated via the login step
          # above. Should a job still flake: gh run rerun --failed on the
          # newest run of the branch (an older run builds but does not publish,
          # see the publish job) — never on a run from before the channel
          # split, whose publish step would delete main/ and stable/.
          FEEDNAME: wwand
          # lifts GitHub's anonymous clone limit for the feed updates; see the
          # note in the action's entrypoint. Read-only, and the default token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bytecode shipping needs NOTHING here, and that is the point.
          #
          # It used to be an opt-in symbol pushed through EXTRA_CONFIG, which
          # turned the whole openwrt-25.12 matrix red: defconfig dropped both
          # CONFIG_WWAND_UCODE_PRECOMPILE and the CONFIG_PACKAGE_wwand it
          # depended on, so a per-package SDK build could not carry it. The
          # Makefile now states the opposite polarity — bytecode is the default
          # and CONFIG_WWAND_UCODE_SOURCE opts OUT — so a symbol that does not
          # survive defconfig lands on the behaviour we want instead of
          # silently reverting it. PKG_BUILD_DEPENDS pulls ucode/host
          # unconditionally, and the cmake capability probe ships source rather
          # than failing if that compiler cannot emit bytecode.
          #
          # EXTRA_CONFIG stays wired (and is verified after `feeds install`)
          # for whatever needs it next; it is deliberately empty.
          EXTRA_CONFIG: ''
          # PACKAGES comes from the "Package list" step (GITHUB_ENV) — do not
          # set it here, a step env would override it.
          INDEX: 1
          # not staged for openwrt.org upstream — skip patch-refresh and
          # shfmt hygiene checks; the hash check stays active
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # usign key for opkg-based releases (<= 24.10), apk key for
          # snapshot/25.12+. Empty secrets simply leave the index unsigned.
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # ddimension-feed can work this out from the buildroot version, but
          # here it need not guess: this is the directory the publish job below
          # writes to, so the .list it installs and the tree it points at cannot
          # disagree. Its channel is DDIMENSION_FEED_CHANNEL (workflow env).
          DDIMENSION_FEED_RELEASE: ${{ matrix.release }}

      # ddimension-feed.apk: a name without a version, so the direct download
      # links in README.md and on the site's start page survive every release
      # bump. It is not in packages.adb, so apk never sees it as a package of
      # the repository. (Installed from a file, apk pins it — README.md says to
      # follow up with `apk add ddimension-feed`.)
      - name: Collect repository
        run: |
          dest="public/${{ matrix.release }}/${{ matrix.arch }}"
          mkdir -p "$dest"
          cp -a "bin/packages/${{ matrix.arch }}/wwand/." "$dest/"
          for f in "$dest"/ddimension-feed-[0-9]*.apk; do
            [ -f "$f" ] && cp "$f" "$dest/ddimension-feed.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}-${{ matrix.arch }}
          path: public
          retention-days: 30

  publish:
    # Publish whatever succeeded even if some matrix legs failed: a leg without
    # an artifact leaves its published tree as it is. !cancelled() keeps that —
    # without a status function GitHub adds success() and one red leg would
    # block the whole publish. Only the two channel branches publish.
    needs: build
    if: ${{ !cancelled() && (github.ref_name == 'main' || github.ref_name == 'stable') }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      # s.o.: vollen Baum erzwingen, sonst fehlen z.B. keys/ und .github/ci/.
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      # No stored credentials: publish-pages.sh brings its own, and a second
      # Authorization header makes GitHub answer 400 "Duplicate header".
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true

      # Replaces exactly <channel>/<release>/<arch> for every leg that built
      # (plus the pre-channel mirror for stable) and nothing else — the other
      # channel and the device images stay as they are. Concurrent publishes
      # (the other channel, the image run) are handled in publish-pages.sh,
      # the newest-commit rule in publish-feed.sh.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The same script publishes a finished run by hand when only its
        # publish failed (.github/ci/publish-feed.sh <run-id>) — no rebuild.
        # It also refuses when the branch has moved on since this run.
        run: |
          .github/ci/publish-feed.sh --dir fresh \
            --channel "$DDIMENSION_FEED_CHANNEL" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
