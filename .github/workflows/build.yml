# Build the feed for every release branch × package architecture and publish
# the binary package repositories to GitHub Pages (gh-pages branch).
#
# One workflow, two channels:
#   push to main          -> builds and publishes main/<release>/<arch>/ (development)
#   push to stable        -> builds only: stable is prepared over several pushes
#                            (cherry-picks, scripts/stable-take.sh) and nothing of
#                            it reaches devices yet
#   release tag on stable -> builds and publishes stable/<release>/<arch>/,
#     (YYYY.MM.DD[.N],       mirrored to the pre-channel path <release>/<arch>/
#     release-stable.sh)     that devices set up before the split still follow
# A workflow_dispatch on any other branch builds but publishes nothing.
#
# Efficiency: a new push cancels the still-running build of the same ref
# (main, stable and every tag are separate groups), .md-only branch pushes don't
# trigger at all (path filters do not apply to tag pushes), and gh-pages is a
# single orphan commit so the branch never grows (.github/ci/publish-pages.sh,
# the only writer of that branch).
name: build

on:
  push:
    branches: [main, stable]
    tags: ['20[0-9][0-9].[0-9][0-9].[0-9][0-9]*']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      # Repair path: a build was green but its publish lost the race — main had
      # moved on by the time the publish job ran (publish-feed.sh refuses to
      # roll a channel back, which is right). Rebuilding the same packages for
      # hours is the wrong answer when the newer commits touched no package at
      # all, as CI-only commits do. This publishes that run's artifacts, which
      # live for 30 days. Leave empty for a normal build.
      publish_run:
        description: 'nur veroeffentlichen: Artefakte dieses Build-Laufs (Reparatur), leer = normal bauen'
        type: string
        default: ''
      publish_sha:
        description: 'Commit jenes Laufs (Stempel der veroeffentlichten Baeume)'
        type: string
        default: ''
      publish_channel:
        description: 'Kanal jenes Laufs'
        type: choice
        options: [main, stable]
        default: main

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The channel of this run: where its packages are published, and the tree the
  # ddimension-feed package built here points devices at (the SDK action passes
  # it into the build). A release tag and the stable branch build as stable,
  # anything else as main; only main pushes and release tags publish (see the
  # publish job).
  DDIMENSION_FEED_CHANNEL: ${{ (github.ref_type == 'tag' || github.ref_name == 'stable') && 'stable' || 'main' }}

jobs:
  build:
    # beim Reparatur-Dispatch wird nichts gebaut, nur publiziert
    if: ${{ inputs.publish_run == '' }}
    runs-on: [self-hosted, openwrt]
    # 120 was enough until luci-app-wwand-statistics arrived (f21d172): it
    # depends on luci-app-statistics, which pulls collectd and with it gnutls
    # and libmicrohttpd. On the slowest arch that is the difference between
    # finishing and not — arm_cortex-a7_neon-vfpv4/snapshot took 73 and 80
    # minutes on the two runs before, then hit the limit mid-collectd twice and
    # left that tree stuck a version behind while every other arch published.
    # Nothing hung: the log shows it still compiling when the clock ran out.
    #
    # 240 -> 300 with the runner fleet of 2026-09-27: the new CTs get 7 cores
    # where n5/n6 had 10, and a fresh CT starts with empty dl/ccache volumes, so
    # the first run on it builds everything from scratch. Legs that used to take
    # 45-75 minutes were past 95 and still going. Five hours is head-room, not a
    # target — a leg that actually hangs still dies, just later.
    #
    # 300 -> 420: openwrt-25.12 legs now run 2.6-4.6 h, and 25.12/x86_64 hit 300
    # still compiling (run 36922244803, 2026-10-02), leaving that tree a
    # release behind while the other 15 published. The runners are self-hosted,
    # so GitHub's 6 h cap for hosted runners does not apply.
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt release branches to build. Add future OpenWrt releases here as
        # they appear (the value doubles as the directory name on the site;
        # 'snapshot' builds against master). A release dropped from this list
        # keeps its published trees until they are removed explicitly
        # (publish-pages.sh --remove).
        release:
          - snapshot
          - openwrt-25.12
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          # rockchip/armv8 (RK33xx/RK35xx) sets ARCH:=aarch64 and no CPU_TYPE,
          # so the whole subtarget lands on the generic aarch64 package arch —
          # and with it every Hinlink/NanoPi/Radxa board in that family, none of
          # which could add this feed at all (ddimension/wwand#23).
          - aarch64_generic
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      # Self-hosted-Runner teilen sich das Checkout-Verzeichnis zwischen allen
      # Jobs beider Workflows. Ein liegengebliebener sparse-checkout (den
      # build-device-images.yml bis zur Kanal-Trennung nutzte) wurde von
      # actions/checkout NICHT zuverlaessig zurueckgebaut -> Workspace enthielt nur
      # .git/.github -> /feed leer -> "No feed for package" -> Jobs rot. Heute
      # checkt kein Job mehr sparse aus; der Reset bleibt, damit kein alter
      # Workspace-Stand in einen Build durchschlaegt (Repo ist klein, Vollclone ~gratis).
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      # No docker.io login any more: the SDK action builds its image with plain
      # `docker build` from ghcr.io and pulls nothing from docker.io, so there is
      # no anonymous pull limit left to lift. It used to be needed for the qemu
      # binfmt image, and docker.io's TLS timeouts then killed whole matrices
      # (36185475232, 36190510953, 36201899551, 36208538174).

      # Per-package mode: the SDK action builds exactly these source packages
      # plus their real dependencies — no whole-feed surface, no exposure to
      # unrelated upstream breakage (the perl parallel-build race cost us a job
      # in three runs). The per-package check enforces PKG_MIRROR_HASH: after
      # every PKG_SOURCE_VERSION bump run scripts/update-hashes.sh and commit
      # the Makefile change. The list lives in .github/ci/packages, which
      # scripts/local-build.sh reads too. An empty PACKAGES would make the
      # action build the WHOLE feed (entrypoint.sh) — heatingrod's rust
      # toolchain included — so empty is an error, never a default.
      - name: Package list
        run: |
          pkgs="$(sed 's/#.*//' .github/ci/packages | xargs)"
          [ -n "$pkgs" ] || { echo "::error file=.github/ci/packages::no packages listed"; exit 1; }
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "channel $DDIMENSION_FEED_CHANNEL, packages: $pkgs"

      # make -j inside the SDK container. nproc reports the node's cores there:
      # the runner CT's cgroup quota is invisible inside the nested container
      # (own cgroup namespace -> cpu.max = max), so the SDK would overshoot by a
      # factor. The quota is only readable HERE, in the runner CT, so read it
      # here and pass it in — the same trick build-device-images.yml uses for
      # the image builds. It also narrows the hostapd parallel-variant race
      # documented in the action's entrypoint.sh.
      - name: Parallelism
        run: |
          jobs="$(nproc)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then                    # cgroup v2
            read -r q p < /sys/fs/cgroup/cpu.max
            if [ "$q" != max ] && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then     # cgroup v1
            q="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            p="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [ "${q:-0}" -gt 0 ] 2>/dev/null && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          fi
          [ "${jobs:-0}" -ge 1 ] 2>/dev/null || jobs=1
          echo "NPROC=$jobs" >> "$GITHUB_ENV"
          echo "make -j$jobs (cores released to this runner CT)"

      - name: Build packages
        uses: ./.github/actions/openwrt-sdk
        env:
          ARCH: ${{ matrix.arch }}${{ matrix.release != 'snapshot' && format('-{0}', matrix.release) || '' }}
          # NOTE on registry flakes: the SDK image comes from ghcr.io (action
          # default; CONTAINER would be the UNTAGGED image — the action appends
          # :$ARCH itself), and nothing else is pulled — no docker.io, no
          # buildkit, no binfmt. Should a job still flake: gh run rerun --failed on the
          # newest run of the branch (an older run builds but does not publish,
          # see the publish job) — never on a run from before the channel
          # split, whose publish step would delete main/ and stable/.
          FEEDNAME: wwand
          # lifts GitHub's anonymous clone limit for the feed updates; see the
          # note in the action's entrypoint. Read-only, and the default token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bytecode shipping needs NOTHING here, and that is the point.
          #
          # It used to be an opt-in symbol pushed through EXTRA_CONFIG, which
          # turned the whole openwrt-25.12 matrix red: defconfig dropped both
          # CONFIG_WWAND_UCODE_PRECOMPILE and the CONFIG_PACKAGE_wwand it
          # depended on, so a per-package SDK build could not carry it. The
          # Makefile now states the opposite polarity — bytecode is the default
          # and CONFIG_WWAND_UCODE_SOURCE opts OUT — so a symbol that does not
          # survive defconfig lands on the behaviour we want instead of
          # silently reverting it. PKG_BUILD_DEPENDS pulls ucode/host
          # unconditionally, and the cmake capability probe ships source rather
          # than failing if that compiler cannot emit bytecode.
          #
          # EXTRA_CONFIG stays wired (and is verified after `feeds install`)
          # for whatever needs it next; it is deliberately empty.
          EXTRA_CONFIG: ''
          # PACKAGES comes from the "Package list" step (GITHUB_ENV) — do not
          # set it here, a step env would override it.
          INDEX: 1
          # not staged for openwrt.org upstream — skip patch-refresh and
          # shfmt hygiene checks; the hash check stays active
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # usign key for opkg-based releases (<= 24.10), apk key for
          # snapshot/25.12+. Empty secrets simply leave the index unsigned.
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
          PUBLISH_SHA: ${{ inputs.publish_sha }}
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
          # ddimension-feed can work this out from the buildroot version, but
          # here it need not guess: this is the directory the publish job below
          # writes to, so the .list it installs and the tree it points at cannot
          # disagree. Its channel is DDIMENSION_FEED_CHANNEL (workflow env).
          DDIMENSION_FEED_RELEASE: ${{ matrix.release }}

      # On a red leg the job log only says "failed to build (build variant: …)";
      # the actual compiler/make error lives in the SDK's per-package logs
      # (BUILD_LOG=1 -> logs/package/<feed>/<pkg>/[<variant>/]compile.txt), which
      # entrypoint.sh copies into the workspace at the end. Without this step
      # they die with the container and every failure has to be reproduced
      # locally first (that is how the hostapd variant race stayed invisible).
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.release }}-${{ matrix.arch }}
          path: logs
          retention-days: 30
          if-no-files-found: ignore

      # ddimension-feed.apk: a name without a version, so the direct download
      # links in README.md and on the site's start page survive every release
      # bump. It is not in packages.adb, so apk never sees it as a package of
      # the repository. (Installed from a file, apk pins it — README.md says to
      # follow up with `apk add ddimension-feed`.)
      - name: Collect repository
        run: |
          dest="public/${{ matrix.release }}/${{ matrix.arch }}"
          mkdir -p "$dest"
          cp -a "bin/packages/${{ matrix.arch }}/wwand/." "$dest/"
          for f in "$dest"/ddimension-feed-[0-9]*.apk; do
            [ -f "$f" ] && cp "$f" "$dest/ddimension-feed.apk"
          done
          # Host tools a package exported into $(BIN_DIR) — today the static
          # rsim-card, built only on x86_64 (wwand-rsim, Hooks/Compile/Post).
          # publish-feed.sh turns tools/<arch>/ into tools/<channel>/<arch>/ on
          # the site, where the start page links it. No leg but x86_64 has one,
          # and the glob simply finds nothing there.
          for t in bin/targets/*/*/rsim-card; do
            [ -f "$t" ] || continue
            mkdir -p "public/tools/${{ matrix.arch }}"
            cp "$t" "public/tools/${{ matrix.arch }}/"
            echo "host tool: $t -> public/tools/${{ matrix.arch }}/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}-${{ matrix.arch }}
          path: public
          retention-days: 30

  publish:
    # Publish whatever succeeded even if some matrix legs failed: a leg without
    # an artifact leaves its published tree as it is. !cancelled() keeps that —
    # without a status function GitHub adds success() and one red leg would
    # block the whole publish. Only main pushes and release tags publish; a push
    # to the stable branch only builds.
    needs: build
    if: ${{ !cancelled() && (inputs.publish_run != '' || (github.ref_type == 'branch' && github.ref_name == 'main') || github.ref_type == 'tag') }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
      actions: read # Artefakte eines ANDEREN Laufs lesen (Reparaturpfad)
    steps:
      # s.o.: vollen Baum erzwingen, sonst fehlen z.B. keys/ und .github/ci/.
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      # No stored credentials: publish-pages.sh brings its own, and a second
      # Authorization header makes GitHub answer 400 "Duplicate header".
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: ${{ inputs.publish_run == '' }}
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true

      # Reparaturpfad: die Artefakte des genannten Laufs statt der eigenen.
      - uses: actions/download-artifact@v4
        if: ${{ inputs.publish_run != '' }}
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true
          run-id: ${{ inputs.publish_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The publisher keeps the last versions of every package in a tree and
      # therefore rebuilds and re-signs the index — with apk, which exists
      # neither here nor on the runner. It runs apk-tools from our registry
      # (.github/ci/apk-retention.sh); docker.io is deliberately not involved.
      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: image-registry.ddimension.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Replaces exactly <channel>/<release>/<arch> for every leg that built
      # (plus the pre-channel mirror for stable) and nothing else — the other
      # channel and the device images stay as they are. Concurrent publishes
      # (the other channel, the image run) are handled in publish-pages.sh,
      # the newest-commit rule in publish-feed.sh.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same key the SDK signs a fresh index with: the publisher rebuilds
          # the index whenever a tree keeps more than one version per package,
          # and an unsigned index would be a regression for every device.
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
          PUBLISH_SHA: ${{ inputs.publish_sha }}
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
        # The same script publishes a finished run by hand when only its
        # publish failed (.github/ci/publish-feed.sh <run-id>) — no rebuild.
        # It also refuses when the branch has moved on since this run.
        run: |
          if [ -n "$PUBLISH_RUN" ]; then
            # Reparatur: Kanal, Commit und Lauf-Id kommen aus den Eingaben, und
            # --force hebt die Spitzenpruefung auf — gedacht fuer genau den
            # Fall, dass seit dem Bau nur CI/Doku committet wurde. Vorher
            # pruefen, ob das stimmt, ist Sache dessen, der dispatcht.
            [ -n "$PUBLISH_SHA" ] || { echo "::error::publish_sha fehlt"; exit 1; }
            .github/ci/publish-feed.sh --dir fresh \
              --channel "$PUBLISH_CHANNEL" --sha "$PUBLISH_SHA" --run "$PUBLISH_RUN" --force
            exit $?
          fi
          tag=()
          [ "$GITHUB_REF_TYPE" != tag ] || tag=(--tag "$GITHUB_REF_NAME")
          .github/ci/publish-feed.sh --dir fresh \
            --channel "$DDIMENSION_FEED_CHANNEL" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" "${tag[@]}"
