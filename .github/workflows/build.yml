# Build the feed for every release branch × package architecture and publish
# the binary package repositories to GitHub Pages (gh-pages branch), one
# directory per <release>/<arch>.
#
# Efficiency: a new push to main cancels the still-running previous build
# (concurrency group), .md-only changes don't trigger at all, artifacts are
# kept for 2 days only, and gh-pages history is collapsed to a single commit
# per deploy (force_orphan) so the branch never grows.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, openwrt]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Release branches to build. Add future OpenWrt releases here as they
        # appear (the value doubles as the directory name on the site;
        # 'snapshot' builds against master).
        #
        release:
          - snapshot
          - openwrt-25.12
          - openwrt-24.10
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      - uses: actions/checkout@v4

      # authenticated docker.io pulls (qemu binfmt inside gh-action-sdk) —
      # avoids the anonymous-pull rate-limit/timeout flakes
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build packages
        uses: ./.github/actions/openwrt-sdk
        env:
          ARCH: ${{ matrix.arch }}${{ matrix.release != 'snapshot' && format('-{0}', matrix.release) || '' }}
          # NOTE on registry flakes: the SDK image already comes from ghcr.io
          # (action default; CONTAINER would be the UNTAGGED image — the
          # action appends :$ARCH itself). docker.io is only touched for the
          # embedded qemu binfmt pull, authenticated via the login step
          # above. Should a job still flake: gh run rerun --failed.
          FEEDNAME: wwand
          # Per-package mode: builds exactly these source packages plus their
          # real dependencies — no whole-feed surface, no exposure to
          # unrelated upstream breakage (the perl parallel-build race cost us
          # a job in three runs). The per-package check enforces
          # PKG_MIRROR_HASH: after every PKG_SOURCE_VERSION bump run
          # scripts/update-hashes.sh and commit the Makefile change.
          # (snapcast, homesync stay out of the list and
          # additionally carry @BROKEN.)
          PACKAGES: apman luacurl lua-mosquitto usb-relay-hid qfirehose qlog wwand wwand-lpac luci-app-wwand luci-proto-wwand
          INDEX: 1
          # not staged for openwrt.org upstream — skip patch-refresh and
          # shfmt hygiene checks; the hash check stays active
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # usign key for opkg-based releases (<= 24.10), apk key for
          # snapshot/25.12+. Empty secrets simply leave the index unsigned.
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Collect repository
        run: |
          mkdir -p "public/${{ matrix.release }}/${{ matrix.arch }}"
          cp -a "bin/packages/${{ matrix.arch }}/wwand/." \
                "public/${{ matrix.release }}/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}-${{ matrix.arch }}
          path: public
          retention-days: 30

  publish:
    # publish whatever succeeded even if some matrix legs failed — the seed
    # from the current gh-pages below keeps their previous state alive
    needs: build
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # seed with the currently published site so <release>/<arch> dirs that
      # were not (re)built in this run survive the deploy
      - uses: actions/checkout@v4
        continue-on-error: true # first run: gh-pages doesn't exist yet
        with:
          ref: gh-pages
          path: public

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true

      - name: Merge fresh build into site
        run: |
          mkdir -p public fresh
          rm -rf public/.git
          # replace (not overlay) every dir that was rebuilt, so outdated
          # package versions don't accumulate
          for archdir in fresh/*/*/; do
            [ -d "$archdir" ] || continue
            dest="public/${archdir#fresh/}"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            mv "$archdir" "$dest"
          done
          # public signing keys (committed under keys/) at the site root
          if [ -d keys ]; then cp -a keys public/; fi
          find public -maxdepth 2 -type d | sort

      # GitHub Pages serves no directory listings — generate a static
      # index.html per directory so the repo is browsable
      - name: Generate directory indexes
        run: |
          find public -type d | while read -r d; do
            rel="${d#public}"; rel="${rel#/}"
            {
              printf '<!doctype html><meta charset="utf-8">'
              printf '<title>openwrt-repo/%s</title>' "$rel"
              printf '<style>body{font:14px/1.5 monospace;margin:2em}td{padding:0 1.5em 0 0}</style>'
              printf '<h2>openwrt-repo/%s</h2><table>' "$rel"
              [ -n "$rel" ] && printf '<tr><td><a href="../">../</a></td><td></td></tr>'
              for e in "$d"/*; do
                [ -e "$e" ] || continue
                n="$(basename "$e")"
                [ "$n" = index.html ] && continue
                if [ -d "$e" ]; then
                  printf '<tr><td><a href="%s/">%s/</a></td><td></td></tr>' "$n" "$n"
                else
                  printf '<tr><td><a href="%s">%s</a></td><td>%s</td></tr>' \
                    "$n" "$n" "$(du -h "$e" | cut -f1)"
                fi
              done
              printf '</table>'
            } > "$d/index.html"
          done
          echo "indexed $(find public -name index.html | wc -l) directories"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true
          commit_message: 'packages @ ${{ github.sha }}'
