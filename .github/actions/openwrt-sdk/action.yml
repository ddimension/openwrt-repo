name: "OpenWrt SDK (vendored + persistent dl/ccache)"
description: "Build OpenWrt packages via the SDK, with node-local dl/ccache caches"
author: aparcar
# Vendored from openwrt/gh-action-sdk@v11. Aenderungen ggü. Upstream:
#   - persistente, arch-uebergreifend geteilte Named Volumes 'openwrt-dl' und
#     'openwrt-ccache', als -v /dl bzw. -v /ccache in den SDK-Container gemountet
#     (siehe entrypoint.sh). Node-lokal (leben im Docker des Runner-CT), bleiben
#     ueber Laeufe erhalten, verschwinden erst bei Neuerzeugung des CT.
#   - Image-Build per plain `docker build` statt qemu/buildx/build-push-action:
#     keine Pulls von docker.io mehr (Begruendung am Schritt unten).
#   - NPROC wird durchgereicht (make -j im Container, siehe entrypoint.sh).
runs:
  using: 'composite'
  steps:
    - run: |
        echo "artifacts_dir=${ARTIFACTS_DIR:-$GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
        echo "feed_dir=${FEED_DIR:-$GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
      shell: bash
      id: inputs
    - run: sudo chown -R 1000:1000 ${{ steps.inputs.outputs.artifacts_dir }} ${{ steps.inputs.outputs.feed_dir }}
      shell: bash
    # Plain `docker build` statt qemu + buildx + build-push-action: das
    # Dockerfile ist ein FROM auf ghcr.io/openwrt/sdk plus ein ADD, der Build
    # dauert Sekunden. buildx brachte dafuer nur einen gha-Cache -- kostete aber
    # je Leg Pulls von moby/buildkit und tonistiigi/binfmt, und die kommen von
    # docker.io. Deren TLS-Timeouts ("net/http: TLS handshake timeout" gegen
    # registry-1.docker.io) legten am 25./26.09.2026 reihenweise Legs still
    # (36185475232, 36190510953, 36201899551, zuletzt 36208538174 mitten in
    # "Build packages", nachdem der Login-Schritt schon entschaerft war). So
    # beruehrt der Feed-Build docker.io gar nicht mehr; qemu braucht er nicht,
    # Runner und SDK-Images sind x86_64.
    - name: Build SDK container image
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=()
        if [ -n "${CONTAINER:-}" ]; then args+=(--build-arg "CONTAINER=$CONTAINER"); fi
        if [ -n "${ARCH:-}" ]; then args+=(--build-arg "ARCH=$ARCH"); fi
        docker build "${args[@]}" -t sdk "$ACTION_PATH"

    # Persistente Caches vorbereiten: Named Volumes anlegen und dem SDK-Build-User
    # (uid 1000) uebereignen, damit der Container hineinschreiben darf.
    - name: Prepare persistent dl/ccache volumes
      shell: bash
      run: |
        for v in openwrt-dl openwrt-ccache; do
          docker volume create "$v" >/dev/null
          sudo chown 1000:1000 "$(docker volume inspect -f '{{.Mountpoint}}' "$v")"
        done

    - run: |
        docker run --rm \
          --env BUILD \
          --env BUILD_LOG \
          --env DDIMENSION_FEED_CHANNEL \
          --env DDIMENSION_FEED_RELEASE \
          --env EXTRA_CONFIG \
          --env EXTRA_FEEDS \
          --env FEEDNAME \
          --env GH_TOKEN \
          --env IGNORE_ERRORS \
          --env KEY_BUILD \
          --env PRIVATE_KEY \
          --env NO_DEFAULT_FEEDS \
          --env NO_REFRESH_CHECK \
          --env NO_SHFMT_CHECK \
          --env NPROC \
          --env PACKAGES \
          --env INDEX \
          --env V \
          -v ${{ steps.inputs.outputs.artifacts_dir }}:/artifacts \
          -v ${{ steps.inputs.outputs.feed_dir }}:/feed \
          -v openwrt-dl:/dl \
          -v openwrt-ccache:/ccache \
          sdk
      shell: bash
    - run: sudo chown -R --reference=${{ steps.inputs.outputs.artifacts_dir }}/.. ${{ steps.inputs.outputs.artifacts_dir }}
      shell: bash
      if: always()
    - run: sudo chown -R --reference=${{ steps.inputs.outputs.feed_dir }}/.. ${{ steps.inputs.outputs.feed_dir }}
      shell: bash
      if: always()
